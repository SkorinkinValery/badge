# A generic, single database configuration.

[alembic]
# path to migration scripts — relative to this ini file location (backend/)
script_location = %(here)s/app/db/migrations

# template used to generate migration file names
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# timezone for file names
timezone = UTC

# version table name in the database
version_table = alembic_version

# Database URL — overridden by env.py reading from Settings
sqlalchemy.url = postgresql+psycopg2://badge:badge@localhost:5432/badge

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
