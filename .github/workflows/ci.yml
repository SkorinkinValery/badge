name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.11.13"

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: uv pip install -e ".[dev]" --python 3.11

      - name: Run ruff lint
        run: uv run ruff check backend/

      - name: Run ruff format check
        run: uv run ruff format --check backend/

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.11.13"

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: uv pip install -e ".[dev]" --python 3.11

      - name: Run mypy
        run: uv run mypy backend/app --strict

  test:
    name: Tests (pytest)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.11.13"

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        # eval extra brings jiwer, needed by backend/tests/scripts/*
        run: uv pip install -e ".[dev,eval]" --python 3.11

      # Та же изолированная инфра, что и локально (make test): Postgres
      # :5435/badge_test + MinIO :9100. conftest сам перенаправляет тесты на неё
      # (DATABASE_URL не задаём — он пуст → берётся тестовый URL с badge_test).
      - name: Start isolated test infra (Postgres :5435/badge_test, MinIO :9100)
        run: docker compose -f infra/docker-compose.test.yml up -d --wait

      # Проверяем, что миграции применяются С НУЛЯ на отдельной чистой БД
      # (не badge_test, чтобы не пересекаться с create_all из тестов).
      - name: Validate Alembic migrations apply from scratch
        run: |
          docker compose -f infra/docker-compose.test.yml exec -T postgres-test \
            psql -U badge -d badge_test -c "CREATE DATABASE badge_migrate;"
          DATABASE_URL=postgresql+asyncpg://badge:badge@localhost:5435/badge_migrate \
            uv run alembic -c backend/alembic.ini upgrade head

      - name: Run pytest
        run: uv run pytest backend/tests/ -v

      - name: Tear down test infra
        if: always()
        run: docker compose -f infra/docker-compose.test.yml down -v

  eval:
    name: Eval (non-critical)
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.11.13"

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install eval dependencies
        run: uv pip install -e ".[dev,eval]" --python 3.11

      - name: Check for datasets
        id: check_datasets
        run: |
          if [ -d "datasets" ] && [ "$(ls -A datasets 2>/dev/null)" ]; then
            echo "HAS_DATASETS=true" >> $GITHUB_OUTPUT
          else
            echo "HAS_DATASETS=false" >> $GITHUB_OUTPUT
          fi

      - name: Run eval scripts (only if datasets exist)
        if: steps.check_datasets.outputs.HAS_DATASETS == 'true'
        run: |
          uv run python scripts/eval_wer.py || true
          uv run python scripts/eval_kpi.py || true
          uv run python scripts/regression_harness.py || true
