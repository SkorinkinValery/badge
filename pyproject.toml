[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "audiobadge-backend"
version = "0.1.0"
description = "MVP AI-анализа звонков менеджеров (Аудиобейдж)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.13.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "structlog>=24.2.0",
    "pyyaml>=6.0.1",
    "langgraph>=0.1.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "langgraph-checkpoint-postgres>=3.1.0",
    "boto3>=1.43.23",
    "python-magic>=0.4.27",
    "types-boto3>=1.43.23",
    "faster-whisper>=1.2.1",
    "openai>=2.41.0",
    "argon2-cffi>=23.1",
    "python-jose[cryptography]>=3.3",
    "types-python-jose>=3.5.0.20260408",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "anyio>=4.4.0",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
    "types-pyyaml>=6.0.12",
]
eval = [
    "jiwer>=3.0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
pythonpath = ["backend"]
markers = [
    "db: marks tests that require a live Postgres database",
    "contract: marks contract tests for port implementations",
    "integration: marks tests that require external services (MinIO, ffmpeg)",
    "heavy: marks tests that require model download or GPU (skipped in standard CI)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["backend"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "N",   # pep8-naming
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = false
mypy_path = "backend"
files = ["backend/app"]

[[tool.mypy.overrides]]
module = "faster_whisper.*"
ignore_missing_imports = true
