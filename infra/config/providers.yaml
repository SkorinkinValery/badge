# Providers configuration for Аудиобейдж MVP
# IMPORTANT: api_key is NEVER stored here — always from environment (LLM_API_KEY, STT_API_KEY)
# To switch provider: change active_stt / active_llm / active_crm — no code changes needed.

active_stt: faster_whisper

stt:
  faster_whisper:
    model_size: medium      # large-v3 for production; medium/base/tiny for dev/CI
    device: cpu             # cuda if GPU available
    compute_type: int8
    default_language: ru
    vad_filter: true
    initial_prompt: null    # override per-deployment; see M3-T5
    vocabulary: []          # domain terms list; see M3-T5

active_llm:
  adapter: openai_compatible
  base_url: https://api.openai.com/v1
  model: gpt-4o-mini
  # api_key: intentionally omitted — read from LLM_API_KEY env var

active_crm: google_sheets  # json → google_sheets (M8)

crm:
  google_sheets:
    spreadsheet_id: ""      # set via env or admin UI; required in production
    worksheet_name: "Результаты"
    # credentials_json: null  # service account dict; null = use ADC / GOOGLE_APPLICATION_CREDENTIALS
  webhook:
    url: ""                 # required when active_crm: webhook
    headers: {}
    timeout: 10.0
  bitrix24:
    webhook_url: ""         # required when active_crm: bitrix24
    # field_mapping: {}     # optional Bitrix24 field remapping

default_language: ru
