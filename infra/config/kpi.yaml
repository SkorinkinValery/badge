# KPI configuration for Аудиобейдж MVP
# Source of truth for all KPIs — no hardcoding in application code.
# Behavioural anchors (anchors) reduce LLM scoring variance (TZ §12 upgrade #2).
#
# type: scale (0–10) | fact (yes/no -> 0 or 10)
# applies_to: baseline (always evaluated) | script (only when script is assigned)
# include_in_score: whether this KPI participates in the final weighted score

kpis:
  - id: greeting
    label: Приветствие / установление контакта
    type: scale
    weight: 1.0
    applies_to: baseline
    include_in_score: true
    anchors:
      - "0: менеджер не представился, контакт не установлен"
      - "3: представился, но не спросил имя клиента"
      - "5: представился, назвал компанию"
      - "7: представился, назвал компанию, спросил имя клиента"
      - "10: представился, назвал компанию, спросил и использовал имя клиента, задал тон беседы"

  - id: needs_discovery
    label: Выявление потребности
    type: scale
    weight: 1.5
    applies_to: baseline
    include_in_score: true
    anchors:
      - "0: вопросы о потребностях не задавались"
      - "3: задан один закрытый вопрос о потребности"
      - "5: задано 2–3 вопроса, выявлена базовая потребность"
      - "7: задано несколько открытых вопросов, потребность уточнена"
      - "10: глубокое выявление: открытые вопросы, уточнение, активное слушание, резюмирование"

  - id: presentation
    label: Презентация / оффер
    type: scale
    weight: 1.5
    applies_to: baseline
    include_in_score: true
    anchors:
      - "0: презентации не было"
      - "3: перечислены характеристики без связи с потребностью"
      - "5: описаны выгоды, частичная связь с потребностью"
      - "7: выгоды чётко связаны с выявленной потребностью"
      - "10: персонализированная презентация: выгоды + потребность + доказательства + социальное доказательство"

  - id: objections
    label: Работа с возражениями
    type: scale
    weight: 1.5
    applies_to: baseline
    include_in_score: true
    anchors:
      - "0: возражения проигнорированы или провалили разговор"
      - "3: возражение выслушано, но не отработано"
      - "5: возражение отработано, но без доказательств"
      - "7: возражение отработано с аргументами"
      - "10: возражение отработано системно: выслушал → признал → аргумент → проверил снятие"

  - id: price_discussed
    label: Обсуждение цены
    type: fact
    weight: 0.5
    applies_to: baseline
    include_in_score: true
    anchors:
      - "0: цена не была озвучена или обсуждена"
      - "10: цена озвучена и/или обсуждена в контексте ценности"

  - id: cta
    label: CTA / призыв к действию
    type: fact
    weight: 1.0
    applies_to: baseline
    include_in_score: true
    anchors:
      - "0: явного призыва к следующему шагу не было"
      - "10: чёткий призыв к действию (запись, замер, встреча, следующий контакт)"

  - id: measurement_offered
    label: Предложение замера
    type: fact
    weight: 0.5
    applies_to: baseline
    include_in_score: true
    anchors:
      - "0: замер не был предложен"
      - "10: замер предложен клиенту"

  - id: closing
    label: Завершение сделки
    type: scale
    weight: 1.5
    applies_to: baseline
    include_in_score: true
    anchors:
      - "0: разговор завершён без договорённостей"
      - "3: устно обсуждён следующий шаг, но не зафиксирован"
      - "5: следующий шаг согласован"
      - "7: следующий шаг согласован с датой/временем"
      - "10: чёткое закрытие: договорённость + дата + подтверждение + благодарность"

  - id: script_compliance
    label: Соблюдение регламента / скрипта
    type: scale
    weight: 2.0
    applies_to: script
    include_in_score: true
    anchors:
      - "0: грубые нарушения регламента, ключевые этапы пропущены"
      - "3: пропущено более половины этапов скрипта"
      - "5: соблюдена примерно половина этапов"
      - "7: большинство этапов соблюдено, незначительные отклонения"
      - "10: все этапы скрипта соблюдены, нарушений нет"

  - id: tone_politeness
    label: Тональность / вежливость
    type: scale
    weight: 1.0
    applies_to: baseline
    include_in_score: true
    anchors:
      - "0: грубость, агрессия, неуважение к клиенту"
      - "3: нейтральный тон, но холодный и безличный"
      - "5: вежливый тон без явного участия"
      - "7: вежливо, доброжелательно, с вниманием к клиенту"
      - "10: профессионально, тепло, клиент чувствует заботу и уважение"
