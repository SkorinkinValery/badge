# Изолированная инфраструктура ТОЛЬКО для тестов.
#
# Отдельные порты (5435 / 9100 / 9101) и имя проекта `badge-test`, чтобы НИКОГДА
# не пересекаться с dev-данными (`make dev` → 5434 / 9000, проект `infra`).
# Данные эфемерны (tmpfs) — каждый запуск контейнера стартует с чистой БД.
name: badge-test

services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: badge
      POSTGRES_PASSWORD: badge
      POSTGRES_DB: badge_test
    ports:
      - "5435:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U badge -d badge_test"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s

  minio-test:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9100:9000"
      - "9101:9001"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s
